services:
  bot:
    build: .
    container_name: ordersvesta-bot
    restart: unless-stopped
    env_file: .env
    environment:
      SHOP_ID: "7944"
      DATA_DIR: /app/data
      PUBLIC_BASE_URL: "https://ordersvesta.smarbiz.sbs"
      # Stable edge path for the Iran-hosted WooCommerce Bridge.
      BRIDGE_RELAY_URL: "https://vesta-bridge-relay.hsdf7rb.workers.dev"
    volumes:
      - ordersvesta_data:/app/data
      - ./public_media:/app/data/bridge_media
    ports:
      - "127.0.0.1:8094:8080"

volumes:
  ordersvesta_data:
