name: Deploy OrdersVesta Bot

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          BOTTOKEN: ${{ secrets.BOTTOKEN }}
        with:
          host: ${{ secrets.HOST }}
          username: root
          password: ${{ secrets.PASS }}
          envs: BOTTOKEN
          command_timeout: 10m
          script: |
            set -euo pipefail
            export DEBIAN_FRONTEND=noninteractive
            APP_DIR=/opt/ordersvesta
            DOMAIN=ordersvesta.smarbiz.sbs
            REPO=https://github.com/hsdarestani/ordersvesta.git

            if ! command -v docker >/dev/null 2>&1; then
              curl -fsSL https://get.docker.com | sh
            fi
            if ! docker compose version >/dev/null 2>&1; then
              apt-get update -qq
              apt-get install -y docker-compose-plugin
            fi

            mkdir -p "$APP_DIR"
            if [ ! -d "$APP_DIR/.git" ]; then
              git clone "$REPO" "$APP_DIR"
            else
              git -C "$APP_DIR" fetch origin main
              git -C "$APP_DIR" reset --hard origin/main
            fi

            mkdir -p "$APP_DIR/public_media"
            chmod 755 "$APP_DIR/public_media"

            cat > "$APP_DIR/.env" <<EOF
            BOTTOKEN=$BOTTOKEN
            SHOP_ID=7944
            EOF
            chmod 600 "$APP_DIR/.env"

            cd "$APP_DIR"
            docker compose up -d --build --remove-orphans

            if ! command -v nginx >/dev/null 2>&1; then
              apt-get update -qq
              apt-get install -y nginx
            fi

            cat > "/etc/nginx/sites-available/$DOMAIN" <<EOF
            server {
                listen 80;
                server_name $DOMAIN;

                location ^~ /media/ {
                    alias $APP_DIR/public_media/;
                    autoindex off;
                    add_header Cache-Control "private, no-store" always;
                    add_header X-Robots-Tag "noindex, nofollow" always;
                    sendfile on;
                }

                location / {
                    proxy_pass http://127.0.0.1:8094;
                    proxy_http_version 1.1;
                    proxy_set_header Host \$host;
                    proxy_set_header X-Real-IP \$remote_addr;
                    proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto \$scheme;
                    proxy_read_timeout 180s;
                }
            }
            EOF
            ln -sf "/etc/nginx/sites-available/$DOMAIN" "/etc/nginx/sites-enabled/$DOMAIN"
            rm -f /etc/nginx/sites-enabled/default
            nginx -t
            systemctl enable --now nginx
            systemctl reload nginx

            if ! command -v certbot >/dev/null 2>&1; then
              apt-get update -qq
              apt-get install -y certbot python3-certbot-nginx
            fi
            certbot --nginx -d "$DOMAIN" --non-interactive --agree-tos --register-unsafely-without-email --redirect || true

            sleep 3
            docker compose ps
            docker compose logs --tail=30 bot
            curl -fsS http://127.0.0.1:8094/health
            curl -fsS http://127.0.0.1:8094/vestaland-order-sync/health

            echo "Bridge network diagnostics (host)"
            getent ahosts vesta-cosmetics.ir || true
            curl -4IsS --connect-timeout 12 --max-time 18 \
              -o /dev/null -w 'host-ipv4 code=%{http_code} remote=%{remote_ip} connect=%{time_connect} tls=%{time_appconnect} total=%{time_total}\n' \
              https://vesta-cosmetics.ir/ || true
            curl -6IsS --connect-timeout 6 --max-time 10 \
              -o /dev/null -w 'host-ipv6 code=%{http_code} remote=%{remote_ip} connect=%{time_connect} tls=%{time_appconnect} total=%{time_total}\n' \
              https://vesta-cosmetics.ir/ || true

            echo "Bridge network diagnostics (bot container)"
            docker compose exec -T bot python - <<'PY'
            import socket, ssl, time
            host = 'vesta-cosmetics.ir'
            for family, label in ((socket.AF_INET, 'ipv4'), (socket.AF_INET6, 'ipv6')):
                started = time.monotonic()
                try:
                    rows = socket.getaddrinfo(host, 443, family, socket.SOCK_STREAM)
                    print(label, 'addresses=', sorted({row[4][0] for row in rows}))
                    raw = socket.create_connection(rows[0][4], timeout=12)
                    context = ssl.create_default_context()
                    with context.wrap_socket(raw, server_hostname=host) as sock:
                        print(label, 'tls=', sock.version(), 'seconds=', round(time.monotonic() - started, 3))
                except Exception as exc:
                    print(label, 'error=', repr(exc), 'seconds=', round(time.monotonic() - started, 3))
            PY

            echo "Signed Bridge probe from production bot"
            docker compose exec -T bot python - <<'PY'
            import time
            from app.bridge_client import BridgeWooClient
            started = time.monotonic()
            count = BridgeWooClient().probe()
            print('signed-probe success products=', count, 'seconds=', round(time.monotonic() - started, 3))
            PY

            echo "Vestaland paid-order operation probe (must fail before creating an order)"
            docker compose exec -T bot python - <<'PY'
            from app.bridge_client import BridgeWooClient
            try:
                BridgeWooClient().call('create_paid_order', {})
            except Exception as exc:
                text = str(exc)
                print('paid-order-probe=', text)
                if 'Unknown operation' in text or 'unknown operation' in text.lower():
                    raise SystemExit('LIVE_VESTA_WORDPRESS_BRIDGE_IS_OLD')
                if 'Invalid Vestaland receipt' not in text:
                    raise SystemExit('UNEXPECTED_PAID_ORDER_PROBE_RESPONSE: ' + text)
            else:
                raise SystemExit('PAID_ORDER_PROBE_UNEXPECTEDLY_SUCCEEDED')
            print('Vesta WordPress paid-order operation is installed.')
            PY
