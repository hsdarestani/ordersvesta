name: Deploy OrdersVesta Bot

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          BOTTOKEN: ${{ secrets.BOTTOKEN }}
        with:
          host: ${{ secrets.HOST }}
          username: root
          password: ${{ secrets.PASS }}
          envs: BOTTOKEN
          command_timeout: 10m
          script: |
            set -euo pipefail
            export DEBIAN_FRONTEND=noninteractive
            APP_DIR=/opt/ordersvesta
            DOMAIN=ordersvesta.smarbiz.sbs
            REPO=https://github.com/hsdarestani/ordersvesta.git

            if ! command -v docker >/dev/null 2>&1; then
              curl -fsSL https://get.docker.com | sh
            fi
            if ! docker compose version >/dev/null 2>&1; then
              apt-get update -qq
              apt-get install -y docker-compose-plugin
            fi

            mkdir -p "$APP_DIR"
            if [ ! -d "$APP_DIR/.git" ]; then
              git clone "$REPO" "$APP_DIR"
            else
              git -C "$APP_DIR" fetch origin main
              git -C "$APP_DIR" reset --hard origin/main
            fi

            mkdir -p "$APP_DIR/public_media"
            chmod 755 "$APP_DIR/public_media"

            cat > "$APP_DIR/.env" <<EOF
            BOTTOKEN=$BOTTOKEN
            SHOP_ID=7944
            EOF
            chmod 600 "$APP_DIR/.env"

            cd "$APP_DIR"
            docker compose up -d --build --remove-orphans

            if ! command -v nginx >/dev/null 2>&1; then
              apt-get update -qq
              apt-get install -y nginx
            fi

            cat > "/etc/nginx/sites-available/$DOMAIN" <<EOF
            server {
                listen 80;
                server_name $DOMAIN;

                location ^~ /media/ {
                    alias $APP_DIR/public_media/;
                    autoindex off;
                    add_header Cache-Control "private, no-store" always;
                    add_header X-Robots-Tag "noindex, nofollow" always;
                    sendfile on;
                }

                location / {
                    proxy_pass http://127.0.0.1:8094;
                    proxy_http_version 1.1;
                    proxy_set_header Host \$host;
                    proxy_set_header X-Real-IP \$remote_addr;
                    proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto \$scheme;
                    proxy_read_timeout 180s;
                }
            }
            EOF
            ln -sf "/etc/nginx/sites-available/$DOMAIN" "/etc/nginx/sites-enabled/$DOMAIN"
            rm -f /etc/nginx/sites-enabled/default
            nginx -t
            systemctl enable --now nginx
            systemctl reload nginx

            if ! command -v certbot >/dev/null 2>&1; then
              apt-get update -qq
              apt-get install -y certbot python3-certbot-nginx
            fi
            certbot --nginx -d "$DOMAIN" --non-interactive --agree-tos --register-unsafely-without-email --redirect || true

            sleep 3
            docker compose ps
            docker compose logs --tail=30 bot
            curl -fsS http://127.0.0.1:8094/health
