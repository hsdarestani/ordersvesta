name: Package Vesta WordPress Bridge

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'wordpress/vesta-bot-bridge/**'
      - '.github/workflows/package-wordpress-bridge.yml'

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PHP package
        run: |
          set -euo pipefail
          test -s wordpress/vesta-bot-bridge/vesta-bot-bridge.php
          test -s wordpress/vesta-bot-bridge/product-type.php
          test -s wordpress/vesta-bot-bridge/chunk-upload.php
          test -s wordpress/vesta-bot-bridge/paid-order.php
          php -l wordpress/vesta-bot-bridge/vesta-bot-bridge.php
          php -l wordpress/vesta-bot-bridge/product-type.php
          php -l wordpress/vesta-bot-bridge/chunk-upload.php
          php -l wordpress/vesta-bot-bridge/paid-order.php
          grep -q "Plugin Name: Vesta Bot Bridge" wordpress/vesta-bot-bridge/vesta-bot-bridge.php
          grep -q "_vbb_client_key" wordpress/vesta-bot-bridge/product-type.php
      - name: Build installable ZIP
        run: |
          set -euo pipefail
          cd wordpress
          zip -qr ../vesta-bot-bridge.zip vesta-bot-bridge
          cd ..
          unzip -t vesta-bot-bridge.zip
          unzip -p vesta-bot-bridge.zip vesta-bot-bridge/vesta-bot-bridge.php | grep -q "Plugin Name: Vesta Bot Bridge"
          test "$(unzip -Z1 vesta-bot-bridge.zip | grep -c '^vesta-bot-bridge/vesta-bot-bridge.php$')" -eq 1
      - uses: actions/upload-artifact@v4
        with:
          name: vesta-bot-bridge-wordpress
          path: vesta-bot-bridge.zip
          if-no-files-found: error
          retention-days: 30
