name: Live signed Liora to Mahak bridge template probe
on:
  push:
    branches: [feature/liora-mahak-product-registration-20261112]
    paths: [.github/workflows/probe-mahak-signed-bridge-20261112.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: From existing bot container, call HMAC-signed Mahak template lookup (READ ONLY)
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
          PORT: ${{ secrets.SSH_PORT || '9011' }}
        run: |
          set -Eeuo pipefail
          sshpass -e ssh -p "$PORT" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=12 "root@$HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          docker exec -i ordersvesta-bot python - <<'PY'
          from app.bridge_client import BridgeWooClient
          try:
              template=BridgeWooClient().call('mahak_template',{'template_code':'8079'})
              print('SIGNED_MAHAK_TEMPLATE_FOUND='+str(template.get('code')=='8079').lower())
              print('SIGNED_MAHAK_CATEGORY='+str(template.get('category_id')))
              print('NO_MAHAK_WRITE=yes')
          except Exception as exc:
              print('SIGNED_MAHAK_BRIDGE_ERROR='+type(exc).__name__+': '+str(exc)[:240])
              raise SystemExit(13)
          PY
          REMOTE
