name: Verify live Shopino via encrypted Iranian relay (read-only)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-shopino-session-20261122.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shopino-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify live relay and current seller session without modifications
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          port: ${{ secrets.SSH_PORT || '9011' }}
          username: root
          password: ${{ secrets.PASS }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            cd /opt/ordersvesta
            docker compose -p ordersvesta exec -T bot python - <<'PY'
            from app import entrypoint
            from app import main as m
            from app import bridge_client as bridge
            try:
                key = bridge.BridgeWooClient().call('shopino_key')
                assert isinstance(key.get('public_key'), str) and len(key['public_key']) > 30
                print('ENCRYPTED_SITE_RELAY=REACHABLE')
            except Exception as e:
                print('ENCRYPTED_SITE_RELAY=ERROR')
                print('RELAY_ERROR_TYPE=' + type(e).__name__)
                raise SystemExit(10)
            try:
                count = m.api().probe()
                print('SHOPINO_SELLER_SESSION=VALID')
                print('READ_ONLY_VISIBLE_ORDER_COUNT=' + str(count))
            except m.AuthError:
                print('SHOPINO_SELLER_SESSION=EXPIRED')
                raise SystemExit(21)
            except Exception as e:
                print('SHOPINO_SELLER_SESSION=ERROR')
                print('SHOPINO_ERROR_TYPE=' + type(e).__name__)
                print('SHOPINO_ERROR=' + str(e)[:200])
                raise SystemExit(22)
            PY
