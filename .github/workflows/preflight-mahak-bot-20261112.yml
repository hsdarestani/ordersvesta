name: Preflight Liora running server before Mahak integration
on:
  push:
    branches: [feature/liora-mahak-product-registration-20261112]
    paths: [.github/workflows/preflight-mahak-bot-20261112.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Inspect installed bot and service without changes
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
          PORT: ${{ secrets.SSH_PORT || '9011' }}
        run: |
          set -Eeuo pipefail
          sshpass -e ssh -p "$PORT" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=12 "root@$HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          if test -d /opt/ordersvesta/.git; then
            echo BOT_APP_PRESENT=yes
            git -C /opt/ordersvesta rev-parse --short HEAD
          else
            echo BOT_APP_PRESENT=no
          fi
          echo '=== BOT CONTAINERS ==='
          docker ps --format '{{.Names}} {{.Status}}' | grep -i ordersvesta || true
          echo '=== LOCAL HEALTH ==='
          curl --silent --show-error --max-time 8 --write-out 'HTTP=%{http_code}\n' http://127.0.0.1:8094/health || true
          echo BOT_PREFLIGHT_FINISHED=yes
          REMOTE
